name: Gerar cobrinha animada de contribuições

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: {} # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVG da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: DanielLopes31
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff4d00&color_dots=#3a0d00,#7a1a00,#c23b00,#ff6a00,#ffb703&color_background=#0d0d0d
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff4d00&color_dots=#3a0d00,#7a1a00,#c23b00,#ff6a00,#ffb703&color_background=#0d0d0d

      - name: Publicar na branch de saída
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
